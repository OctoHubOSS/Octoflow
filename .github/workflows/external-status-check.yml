name: External Status Check

# Deliberately independent of the webserver and its Postgres instance - this
# is the whole point (see CHANGELOG / status page docs for why). Runs on
# GitHub's infra, hits the public /api/health endpoint over plain HTTPS, and
# commits the result to status-history.ndjson. Never touches the database
# directly, so it keeps recording even if the webserver process or its DB is
# fully down.

on:
  schedule:
    # Every 5 minutes. GitHub doesn't guarantee exact cron timing under load -
    # fine for a status page, not a paging system.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    name: Check API health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        run: bash scripts/check-status.sh status-history.ndjson

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-history.ndjson
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: record external status check"
            git pull --rebase --autostash
            git push
          fi
