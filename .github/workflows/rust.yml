name: Cargo Build & Test

on:
  push:
  pull_request:

env: 
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build_and_test:
    name: Botv2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v3
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.toolchain }}
          workspaces: "bot -> target"
      - name: Install lld
        run: sudo apt-get install -y lld
      - name: Install mold
        run: sudo apt-get install -y mold
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      # nightly is a moving target by design — a transient regression in the
      # compiler itself (not our code) shouldn't block CI. stable/beta stay
      # hard-blocking; nightly failures are visible but non-fatal.
      - run: cargo build --verbose
        continue-on-error: ${{ matrix.toolchain == 'nightly' }}
      - run: cargo test --verbose
        continue-on-error: ${{ matrix.toolchain == 'nightly' }}
