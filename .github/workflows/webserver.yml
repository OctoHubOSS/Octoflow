name: Webserver Build & Test

on:
  push:
  pull_request:

jobs:
  build_and_test:
    name: Webserver
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webserver
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.22"
          - stable
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: webserver/go.sum
      - run: go build -v ./...
      - run: go vet ./...
      - run: go test -v ./...
